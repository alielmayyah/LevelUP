# Checks every push to dev and every pull request: lint, colors, unit tests, and the full e2e suite.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-colors
      - run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      # The production build, served by vite preview, is what the e2e suite checks.
      - name: E2E (all five device sizes)
        run: npm run test:e2e
        env:
          E2E_PROD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
