# Every push to staging: run all checks, then publish the demo web app to GitHub Pages
# and release a signed Android APK (mock data) as a GitHub prerelease.
name: Staging release

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pages:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for /LevelUP/
        run: npm run build:demo
        env:
          VITE_BASE: /LevelUP/
      # Deep links (e.g. /LevelUP/tabs/progress) fall back to the app instead of GitHub's 404 page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Above the last hand-built test APK (versionCode 3), so phones accept it as an update.
      VERSION_CODE: ${{ github.run_number }}0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          echo "name=${base}-staging.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build the web app (mock data)
        run: npm run build:demo
      - run: npx cap sync android
      # With the ANDROID_KEYSTORE_* secrets set, every release is signed with the same staging key and
      # installs as an update. Without them it falls back to a debug-signed APK (uninstall before updating).
      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/staging.keystore"
            export LU_KEYSTORE="$RUNNER_TEMP/staging.keystore"
            ./gradlew assembleRelease --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
            cp app/build/outputs/apk/release/app-release.apk "../LevelUP-$VERSION_NAME.apk"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK."
            ./gradlew assembleDebug --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
            cp app/build/outputs/apk/debug/app-debug.apk "../LevelUP-$VERSION_NAME.apk"
          fi
      - name: Release notes
        run: |
          prev=$(git tag --list 'staging-v*' --sort=-creatordate | head -n 1)
          {
            echo "Staging build ${{ steps.version.outputs.name }} (mock data)."
            echo
            echo "Web: https://alielmayyah.github.io/LevelUP/"
            echo
            echo "## Changes"
            if [ -n "$prev" ]; then git log --no-merges --format='- %s' "$prev"..HEAD; else git log --no-merges --format='- %s' -n 30; fi
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-v${{ steps.version.outputs.name }}
          name: LevelUP ${{ steps.version.outputs.name }}
          body_path: notes.md
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: LevelUP-${{ steps.version.outputs.name }}.apk
