<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" data-avatar="standard-male" role="img" aria-label="LevelUP standard male avatar">
  <title>LevelUP standard male avatar</title>
  <desc>Front-facing pixel art character with curls, a tank, shorts, and solid-color sneakers.</desc>
  <style>
    /* Set the base colors on the inline SVG or an ancestor. */
    [data-avatar="standard-male"] {
      --_hair: var(--avatar-hair, #35192f);
      --_skin: var(--avatar-skin, #d47c51);
    }
    [data-avatar="standard-male"] .outline { fill: #170817; }
    [data-avatar="standard-male"] .skin { fill: var(--_skin); }
    [data-avatar="standard-male"] .skin-shadow { fill: #bb603f; }
    [data-avatar="standard-male"] .hair { fill: var(--_hair); }
    [data-avatar="standard-male"] .hair-light { fill: #49263e; }
    [data-avatar="standard-male"] .hair-shadow { fill: #2a1426; }
    [data-avatar="standard-male"] .tank { fill: var(--avatar-tank, #4b3763); }
    [data-avatar="standard-male"] .shorts { fill: var(--avatar-shorts, #3b2e51); }
    [data-avatar="standard-male"] .shoes { fill: var(--avatar-shoes, #e1d7df); }
    [data-avatar="standard-male"] .eyes { fill: var(--avatar-eyes, #170817); }
    [data-avatar="standard-male"] .smile { fill: var(--avatar-smile, #170817); }

    @supports (color: rgb(from #000 r g b)) {
      /* Match the original palette at the default colors. Shadows scale each
         channel toward black. Highlights use the available room toward white. */
      [data-avatar="standard-male"] .skin-shadow {
        fill: rgb(from var(--_skin) calc(r * 187 / 212) calc(g * 96 / 124) calc(b * 63 / 81));
      }
      [data-avatar="standard-male"] .hair-light {
        fill: rgb(from var(--_hair) calc(r + (255 - r) * 20 / 202)
                                    calc(g + (255 - g) * 13 / 230)
                                    calc(b + (255 - b) * 15 / 208));
      }
      [data-avatar="standard-male"] .hair-shadow {
        fill: rgb(from var(--_hair) calc(r * 42 / 53) calc(g * 20 / 25) calc(b * 38 / 47));
      }
    }
  </style>
